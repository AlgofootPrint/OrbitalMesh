<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OrbitalMesh page not found. Return to the satellite network simulation."
    />
    <meta name="theme-color" content="#0f0f11" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page Not Found | OrbitalMesh</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Space Grotesk", system-ui, sans-serif;
        background: #0f0f11;
        color: #eeeeef;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        width: min(38rem, 100%);
        border: 1px solid #2a2a2f;
        background: #17171b;
        padding: clamp(1.25rem, 5vw, 2rem);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 9vw, 4rem);
        line-height: 1;
      }

      p {
        color: #a0a0ab;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        border: 1px solid #d7a13b;
        color: #f0c36a;
        padding: 0 1rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This route is not part of the OrbitalMesh simulation.</p>
      <a href="/">Return to OrbitalMesh</a>
    </main>
  </body>
</html>
